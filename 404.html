<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page not found | Fxverter</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💱%3C/text%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d14;--surface:#16161f;--surface2:#1e1e2a;--border:rgba(255,255,255,0.08);--text:#eeeef5;--muted:#6868a0;--muted2:#9898c0;--teal:#5ecfb0}
html.theme-light{--bg:#f4f6fa;--surface:#ffffff;--surface2:#eef1f6;--border:rgba(13,13,20,0.10);--text:#1a1c26;--muted:#6b7192;--muted2:#4a5170;--teal:#14967a}
@media (prefers-color-scheme: light){:root:not(.theme-force-dark){--bg:#f4f6fa;--surface:#ffffff;--surface2:#eef1f6;--border:rgba(13,13,20,0.10);--text:#1a1c26;--muted:#6b7192;--muted2:#4a5170;--teal:#14967a}}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2.2rem 1.6rem}
.code{font-size:3.2rem;font-weight:700;letter-spacing:0.06em;background:linear-gradient(135deg,var(--teal),#2e8f78);-webkit-background-clip:text;background-clip:text;color:transparent}
.msg{color:var(--muted2);font-size:0.92rem;line-height:1.6;margin:0.9rem 0 1.4rem}
a.btn{display:inline-block;background:var(--teal);border:none;border-radius:12px;padding:0.65rem 1.4rem;color:#fff;font-weight:700;text-decoration:none;font-size:0.9rem}
a.home{display:block;margin-top:1rem;color:var(--muted);font-size:0.78rem;text-decoration:none}
a.home:hover{color:var(--muted2)}
.spin{display:inline-block;margin-right:0.4rem;animation:sp 1.1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
<script>
// Theme preference follows the rest of the site
(function () { try { var m = localStorage.getItem('fxTheme') || 'auto';
  if (m === 'light') document.documentElement.classList.add('theme-light');
  if (m === 'dark') document.documentElement.classList.add('theme-force-dark'); } catch (e) {} })();
</script>
</head>
<body>
<main class="card">
  <div class="code">404</div>
  <p class="msg" id="msg">This page doesn't exist. Taking you to the converter…</p>
  <a class="btn" id="btn" href="/">Open Fxverter</a>
  <a class="home" id="home" href="/">fxverter.com</a>
</main>
<script>
// Localized one-liner + immediate redirect to the visitor's language home.
// Any dead link (old bookmarks, search results, removed pages) lands here
// instead of a broken placeholder page.
(function () {
  var MSG = {
    en:"This page doesn't exist. Taking you to the converter…",
    tr:"Bu sayfa mevcut değil. Dönüştürücüye yönlendiriliyorsunuz…",
    de:"Diese Seite existiert nicht. Sie werden zum Umrechner weitergeleitet…",
    fr:"Cette page n'existe pas. Redirection vers le convertisseur…",
    es:"Esta página no existe. Te llevamos al conversor…",
    pt:"Esta página não existe. A levá-lo ao conversor…",
    ru:"Такой страницы нет. Перенаправляем в конвертер…",
    zh:"页面不存在，正在带你前往换算器…",
    ja:"このページは存在しません。換算ツールへ移動します…",
    ko:"페이지가 존재하지 않습니다. 환산기로 이동합니다…",
    ar:"هذه الصفحة غير موجودة. جارٍ نقلك إلى المحوّل…",
    hi:"यह पेज मौजूद नहीं है। आपको कन्वर्टर पर ले जाया जा रहा है…",
    id:"Halaman ini tidak ada. Mengarahkan Anda ke konverter…",
    ms:"Halaman ini tidak wujud. Mengarahkan anda ke penukar…",
    tl:"Walang ganitong page. Dinadala ka na sa converter…",
    it:"Questa pagina non esiste. Ti portiamo al convertitore…",
    nl:"Deze pagina bestaat niet. Je wordt naar de omrekenner gebracht…",
    pl:"Ta strona nie istnieje. Przenosimy Cię do przelicznika…",
    uk:"Такої сторінки немає. Перенаправляємо у конвертер…",
    sv:"Sidan finns inte. Du förs vidare till omvandlaren…",
    th:"ไม่มีหน้านี้ในเว็บ กำลังพาคุณไปที่ตัวแปลงสกุลเงิน…",
    lo:"ໜ້ານີ້ບໍ່ມີໃນເວັບ ກຳລັງພາທ່ານໄປຫາຕົວແປງສະກຸນເງິນ…",
    vi:"Trang này không tồn tại. Đang đưa bạn đến công cụ quy đổi…",
    el:"Η σελίδα δεν υπάρχει. Σας μεταφέρουμε στον μετατροπέα…",
    bn:"পৃষ্ঠাটি নেই। আপনাকে কনভার্টারে নিয়ে যাওয়া হচ্ছে…",
    fa:"این صفحه وجود ندارد. در حال انتقال به مبدل ارز…",
    cs:"Tato stránka neexistuje. Přesměrováváme vás do převodníku…",
    ro:"Pagina nu există. Vă ducem la convertor…",
    da:"Siden findes ikke. Du føres videre til omregneren…"
  };
  var raw = (navigator.language || 'en').split('-')[0].toLowerCase();
  var code = raw === 'fil' ? 'tl' : raw;
  var lang = MSG[code] ? code : 'en';
  document.documentElement.lang = lang;
  if (lang === 'ar' || lang === 'fa') document.documentElement.dir = 'rtl';
  var msg = document.getElementById('msg');
  msg.textContent = MSG[lang];
  // spin dot before the message
  var s = document.createElement('span'); s.className = 'spin'; s.textContent = '💱';
  msg.insertBefore(s, msg.firstChild);
  var target = lang === 'en' ? '/' : '/' + lang + '/';
  document.getElementById('btn').href = target;
  document.getElementById('home').href = target;
  if (location.protocol.indexOf('http') === 0) {
    setTimeout(function () { location.replace(location.origin + target); }, 300);
  }
})();
</script>
</body>
</html>
